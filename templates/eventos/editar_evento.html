{% extends "compartidos/base.html" %}
{% block title %}Editar evento{% endblock %}
{% block extra_head %}
<style>
.ee-layout{display:flex;min-height:100vh}
.ee-main{flex:1;max-width:680px;padding:40px 48px 80px}
.ee-header{margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid var(--borde)}
.ee-header h1{font-family:var(--fuente-display);font-size:20px;font-weight:normal;color:var(--texto)}
.card{background:var(--panel);border:1px solid var(--borde);padding:24px 28px}
.campo{margin-bottom:18px}
.campo:last-child{margin-bottom:0}
.campo label{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--texto-dim);margin-bottom:7px}
.campo input,.campo textarea,.campo select{width:100%;background:var(--superficie);border:1px solid var(--borde);color:var(--texto);font-family:var(--fuente-body);font-size:13px;padding:10px 14px;outline:none;transition:border-color .15s}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--texto)}
.campo select option{background:var(--panel)}
.campo textarea{resize:vertical;min-height:80px}
.campo-fila{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-footer{display:flex;justify-content:flex-end;gap:10px;padding-top:16px;border-top:1px solid var(--borde);margin-top:16px}
</style>
{% endblock %}
{% block content %}
<div class="ee-layout">
  {% include 'compartidos/sidebar.html' %}
  <main class="ee-main">
    <div class="ee-header"><h1>Editar evento</h1></div>
    <form method="POST">
      <div class="card">
        <div class="campo">
          <label>Título *</label>
          <input type="text" name="titulo" value="{{ evento.titulo }}" required maxlength="120">
        </div>
        <div class="campo">
          <label>Descripción</label>
          <textarea name="descripcion" maxlength="1000">{{ evento.descripcion or '' }}</textarea>
        </div>
        <div class="campo-fila">
          <div class="campo">
            <label>Categoría</label>
            <select name="categoria">
              {% for cat in ['academico','cultural','deportivo','bienestar'] %}
                <option value="{{ cat }}" {% if evento.categoria==cat %}selected{% endif %}>{{ cat|capitalize }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="campo">
            <label>Organizador</label>
            <input type="text" name="organizador" value="{{ evento.organizador or '' }}" maxlength="100">
          </div>
        </div>
        <div class="campo-fila">
          <div class="campo">
            <label>Fecha *</label>
            <input type="date" name="fecha" value="{{ evento.fecha }}" required>
          </div>
          <div class="campo">
            <label>Cupos (vacío = sin límite)</label>
            <input type="number" name="cupos" value="{{ evento.cupos or '' }}" min="1">
          </div>
        </div>
        <div class="campo-fila">
          <div class="campo">
            <label>Hora inicio</label>
            <input type="time" name="hora_inicio" value="{{ evento.hora_inicio or '' }}">
          </div>
          <div class="campo">
            <label>Hora fin</label>
            <input type="time" name="hora_fin" value="{{ evento.hora_fin or '' }}">
          </div>
        </div>
        <div class="campo">
          <label>Lugar</label>
          <input type="text" name="lugar" value="{{ evento.lugar or '' }}" maxlength="120">
        </div>
        <div class="card-footer">
          <a href="{{ url_for('ver_evento', evento_id=evento.id) }}" class="btn-secondary">Cancelar</a>
          <button type="submit" class="btn-primary">Guardar cambios</button>
        </div>
      </div>
    </form>
  </main>
</div>
{% endblock %}
