<aside class="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-logo">Ágora</div>
    <nav class="sidebar-nav">

      <a class="nav-item {% if pagina_activa == 'feed' %}active{% endif %}"
         href="{{ url_for('feed') }}">
        <span class="nav-icon">◈</span> Feed
      </a>

      <a class="nav-item {% if pagina_activa == 'explorar' %}active{% endif %}"
         href="{{ url_for('explorar') }}">
        <span class="nav-icon">⊕</span> Explorar
      </a>

      <a class="nav-item {% if pagina_activa == 'foros' %}active{% endif %}"
         href="{{ url_for('foros') }}">
        <span class="nav-icon">◉</span> Foros
      </a>

      <a class="nav-item {% if pagina_activa == 'portafolio' %}active{% endif %}"
         href="{{ url_for('portafolio') }}">
        <span class="nav-icon">◫</span> Portafolio
      </a>

      <a class="nav-item {% if pagina_activa == 'eventos' %}active{% endif %}"
         href="{{ url_for('eventos') }}">
        <span class="nav-icon">◷</span> Eventos
      </a>

      <a class="nav-item {% if pagina_activa == 'perfil' %}active{% endif %}"
         href="{{ url_for('perfil') }}">
        <span class="nav-icon">◎</span> Perfil
      </a>

      <!-- ── Notificaciones con badge ── -->
      <a class="nav-item {% if pagina_activa == 'notificaciones' %}active{% endif %}"
         href="{{ url_for('notificaciones') }}"
         id="nav-notificaciones" style="position:relative;">
        <span class="nav-icon">🔔</span> Notificaciones
        <span id="notif-badge" style="
          display:none; position:absolute; right:12px; top:50%;
          transform:translateY(-50%); background:#cf6f6f; color:#fff;
          font-size:9px; font-weight:700; min-width:16px; height:16px;
          border-radius:8px; align-items:center; justify-content:center;
          padding:0 4px; line-height:1;">0</span>
      </a>

      <!-- ── Mensajería con badge ── -->
      <a class="nav-item {% if pagina_activa == 'mensajes' %}active{% endif %}"
         href="{{ url_for('mensajes') }}"
         id="nav-mensajes" style="position:relative;">
        <span class="nav-icon">💬</span> Mensajería
        <span id="msgs-badge" style="
          display:none; position:absolute; right:12px; top:50%;
          transform:translateY(-50%); background:#6f9fcf; color:#fff;
          font-size:9px; font-weight:700; min-width:16px; height:16px;
          border-radius:8px; align-items:center; justify-content:center;
          padding:0 4px; line-height:1;">0</span>
      </a>

      <a class="nav-item {% if pagina_activa == 'ajustes' %}active{% endif %}"
         href="{{ url_for('ajustes') }}">
        <span class="nav-icon">◌</span> Ajustes
      </a>

      <a class="nav-item {% if pagina_activa == 'ayuda' %}active{% endif %}"
         href="{{ url_for('ayuda') }}">
        <span class="nav-icon">◎</span> Ayuda
      </a>

      {% if session.rol in ('admin', 'moderador') %}
        <a class="nav-item {% if pagina_activa == 'moderacion' %}active{% endif %}"
           href="{{ url_for('moderacion') }}"
           style="margin-top:4px; border-top:1px solid var(--borde);">
          <span class="nav-icon">🛡</span> Moderación
        </a>
      {% endif %}

    </nav>
  </div>

  <!-- ── Zona inferior: cerrar sesión + avatar ── -->
  <div class="sidebar-bottom">

    <!-- Botón Salir separado del nav -->
    <a class="sidebar-logout" href="{{ url_for('logout') }}"
       onclick="return confirm('¿Cerrar sesión?')">
      <span class="nav-icon">⏻</span> Salir
    </a>

    <!-- Usuario al pie -->
      <div class="sidebar-user">
      <div class="user-avatar">{{ session.nombre[0].upper() }}</div>
      <div class="user-info">
        <div class="user-name">{{ session.nombre.upper() }}</div>
        <div class="user-carrera">{{ session.carrera }}</div>
      </div>
    </div>

  </div><!-- /sidebar-bottom -->
</aside>

<!-- ══ SOCKET.IO — badges en tiempo real ══ -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function () {
  const notifBadge = document.getElementById('notif-badge');
  const msgsBadge  = document.getElementById('msgs-badge');
  let conteoNotif  = 0;
  let conteoMsgs   = 0;

  const socket = io({ transports: ['websocket', 'polling'] });

  /* ── Al conectar: cargar conteos iniciales ── */
  socket.on('connect', function () {
    // Badge notificaciones
    fetch('/notificaciones/no-leidas')
      .then(r => r.json())
      .then(d => setBadgeNotif(d.total))
      .catch(() => {});

    // Badge mensajes
    fetch('/mensajes/no-leidos')
      .then(r => r.json())
      .then(d => setBadgeMsgs(d.total))
      .catch(() => {});
  });

  /* ── Notificación genérica (like, comentario, etc.) ── */
  socket.on('notificacion', function (data) {
    conteoNotif++;
    setBadgeNotif(conteoNotif);
    mostrarToast('🔔 ' + data.mensaje, data.url);
  });

  /* ── Mensaje privado nuevo ── */
  socket.on('mensaje_nuevo', function (data) {
    // Solo incrementar si no estoy ya en esa conversación
    const enChat = window.location.pathname.startsWith('/mensajes/');
    const mismoConv = enChat && window.location.pathname.includes('/' + data.otro_id);
    if (!mismoConv && data.autor_id !== {{ session.user_id }}) {
      conteoMsgs++;
      setBadgeMsgs(conteoMsgs);
    }
  });

  function setBadgeNotif(n) {
    conteoNotif = n;
    notifBadge.textContent   = n > 99 ? '99+' : n;
    notifBadge.style.display = n > 0 ? 'flex' : 'none';
  }

  function setBadgeMsgs(n) {
    conteoMsgs = n;
    msgsBadge.textContent   = n > 99 ? '99+' : n;
    msgsBadge.style.display = n > 0 ? 'flex' : 'none';
  }

  function mostrarToast(texto, url) {
    const t = document.createElement('a');
    t.href  = url || '#';
    t.style.cssText = [
      'position:fixed', 'bottom:80px', 'right:24px', 'z-index:9999',
      'background:var(--panel)', 'border:1px solid var(--borde)',
      'border-left:3px solid #6fcf6f', 'padding:12px 16px',
      'font-size:11px', 'color:var(--texto)', 'text-decoration:none',
      'max-width:280px', 'line-height:1.4', 'cursor:pointer'
    ].join(';');
    t.textContent = texto;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  /* Limpiar badge de notifics al entrar a /notificaciones */
  if (window.location.pathname === '/notificaciones') setBadgeNotif(0);

  /* Limpiar badge de mensajes al entrar a /mensajes o /mensajes/* */
  if (window.location.pathname.startsWith('/mensajes')) setBadgeMsgs(0);
})();
</script>
