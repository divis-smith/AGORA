<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>{% block title %}Ágora{% endblock %} — La plaza de tu universidad</title>

  <!-- Favicon neutro (símbolo griego simple en SVG inline) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬥</text></svg>"/>

  <!-- Fuente principal desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Sistema de diseño global -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>

  <!-- Estilos adicionales por página (cada template los define) -->
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- ══ MENSAJES FLASH (toasts en esquina inferior derecha) ══ -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="toast-container" id="toast-container">
        {% for category, message in messages %}
          <div class="toast toast--{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- ══ CONTENIDO DE CADA PÁGINA ══ -->
  {% block content %}{% endblock %}

  <!-- ══ SCRIPTS GLOBALES ══ -->
  <script>
    // Auto-desaparece los toasts después de 3.5 segundos
    const toasts = document.querySelectorAll('.toast');
    toasts.forEach(toast => {
      setTimeout(() => {
        toast.classList.add('toast--hide');
        // Elimina el nodo del DOM tras la animación
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    });
  </script>

  <!-- Scripts adicionales por página -->
  {% block extra_scripts %}{% endblock %}

</body>
</html>
